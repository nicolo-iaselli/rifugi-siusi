<style>
/* Layout: plain notes page. Short header and a comparison table, then one section per place beside a sticky schematic map (stacked on phones). */
:root {
  --snow: #f4f5f2;
  --paper: #ffffff;
  --ink: #1d2521;
  --muted: #5d6862;
  --rule: #d9ded8;
  --open: #2e7d4f;
  --closed: #b23a3a;
  --check: #9a6a12;
  --map-bg: #e9eee8;
  --map-bz: #e2eadb;
  --map-tn: #efe9dc;
  --map-bl: #e8e4ee;
  --map-tirol: #e3eaee;
  --map-border: #a39c8e;
  --map-water: #8db6d3;
  --map-road: #cf9d47;
  --map-label: #857d70;
  --relief-opacity: 0.55;
  --relief-blend: multiply;
  --focus: #1f6fb2;

  --font-head: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --snow: #131916; --paper: #1a211d; --ink: #e6eae5; --muted: #9ca79f; --rule: #2c3631;
    --open: #6cc08f; --closed: #ec7b7b; --check: #e0b45c;
    --map-bg: #161d19; --map-bz: #1c2621; --map-tn: #25241e; --map-bl: #23212b; --map-tirol: #1a2226;
    --map-border: #5c625a; --map-water: #4d7c9a; --map-road: #9a7a3d; --map-label: #8f978f; --relief-opacity: 0.7; --relief-blend: overlay; --focus: #7db7ea;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --snow: #131916; --paper: #1a211d; --ink: #e6eae5; --muted: #9ca79f; --rule: #2c3631;
  --open: #6cc08f; --closed: #ec7b7b; --check: #e0b45c;
  --map-bg: #161d19; --map-bz: #1c2621; --map-tn: #25241e; --map-bl: #23212b; --map-tirol: #1a2226;
  --map-border: #5c625a; --map-water: #4d7c9a; --map-road: #9a7a3d; --map-label: #8f978f; --relief-opacity: 0.7; --relief-blend: overlay; --focus: #7db7ea;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--snow); color: var(--ink); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.55; }
a { color: inherit; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header + summary */
.top { padding-block: 36px 8px; }
h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: clamp(1.9rem, 4vw, 2.5rem); line-height: 1.05; text-wrap: balance; }
.intro { margin: 10px 0 0; text-wrap: pretty; }
.checked { margin: 6px 0 0; font-size: 0.875rem; color: var(--muted); }

.summary-wrap { margin-top: 24px; overflow-x: auto; }
.summary { width: 100%; border-collapse: collapse; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.summary th {
  text-align: left; font-weight: 600; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  padding: 0 12px 8px 0; border-bottom: 1px solid var(--rule); white-space: nowrap;
}
.summary td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.summary td:first-child { width: 28px; }
.summary .name a { font-weight: 600; text-decoration: none; }
.summary .name a:hover { text-decoration: underline; }
.summary .sub { display: block; font-size: 0.8125rem; color: var(--muted); }
.num {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--c); color: #fff; font-size: 0.75rem; font-weight: 600;
}
.status { font-weight: 600; white-space: nowrap; }
.status.open { color: var(--open); }
.status.closed { color: var(--closed); }
.status.check { color: var(--check); }
.status-note { display: block; font-weight: 400; color: var(--muted); font-size: 0.8125rem; white-space: normal; }

/* Main */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 640px) minmax(0, 1fr);
  gap: clamp(24px, 4vw, 48px);
  align-items: start;
  padding-block: 12px 40px;
}
.list { min-width: 0; }
.place { --c: var(--ink); padding-block: 32px; border-top: 1px solid var(--rule); scroll-margin-top: 12px; display: grid; gap: 16px; }
.place:first-child { border-top: 0; }
.place-head { display: grid; gap: 2px; }
.place h2 { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--font-head); font-weight: 700; font-size: 1.75rem; line-height: 1.1; }
.place h2 .num { width: 26px; height: 26px; font-size: 0.875rem; flex: none; font-family: var(--font-body); }
.meta { margin: 0; color: var(--muted); font-size: 0.9375rem; }

.collage { display: grid; gap: 4px; border-radius: 6px; overflow: hidden; }
.collage button { all: unset; cursor: zoom-in; display: block; min-width: 0; min-height: 0; position: relative; }
.collage button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.collage img { display: block; width: 100%; height: 100%; max-width: 100%; object-fit: cover; background: var(--rule); }
.collage[data-n="1"] { aspect-ratio: 3 / 2; }
.collage[data-n="2"] { grid-template-columns: 1fr 1fr; aspect-ratio: 2 / 1; }
.collage[data-n="3"], .collage[data-n="4"] { grid-template-columns: repeat(3, 1fr); }
.collage[data-n="3"] button:first-child, .collage[data-n="4"] button:first-child { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
.collage[data-n="3"] button:not(:first-child), .collage[data-n="4"] button:not(:first-child) { aspect-ratio: 4 / 3; }
.collage[data-n="3"] button:nth-child(2) { grid-column: span 2; aspect-ratio: auto; }
.credit { margin: -10px 0 0; font-size: 0.75rem; color: var(--muted); }

.place h3 { margin: 0 0 4px; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.place p { margin: 0; }
.walk-facts { margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.walk-facts b { font-weight: 600; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.9375rem; }
.links button { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.links button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Map */
.map-col { position: sticky; top: 12px; min-width: 0; }
.map-box { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--map-bg); }
#map { height: min(calc(100vh - 90px), 620px); min-height: 400px; background: var(--map-bg); font-family: var(--font-body); }
.map-caption { margin: 8px 2px 0; font-size: 0.8125rem; color: var(--muted); }
.leaflet-container { background: var(--map-bg); }
.leaflet-container a { color: var(--ink); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--snow) 80%, transparent) !important; color: var(--muted); font-family: var(--font-body); }
.leaflet-bar a { background: var(--paper); color: var(--ink); border-bottom-color: var(--rule); }
.leaflet-bar a:hover { background: var(--snow); }
.leaflet-bar { border: 1px solid var(--rule) !important; box-shadow: none !important; }
.leaflet-tooltip { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); font-family: var(--font-body); font-weight: 600; font-size: 0.8125rem; box-shadow: none; }
.leaflet-tooltip-top::before { border-top-color: var(--rule); }
/* Blend on the pane itself: panes are separate stacking contexts, so a blend inside one has no backdrop */
.leaflet-relief-pane { mix-blend-mode: var(--relief-blend); opacity: var(--relief-opacity); pointer-events: none; }
.prov { fill-opacity: 1; stroke: var(--map-border); stroke-width: 1.2; stroke-dasharray: 5 4; }
.prov-bozen { fill: var(--map-bz); }
.prov-trento { fill: var(--map-tn); }
.prov-belluno { fill: var(--map-bl); }
.prov-tirol { fill: var(--map-tirol); }
.river { stroke: var(--map-water); fill: none; }
.road { stroke: var(--map-road); fill: none; }
.route.is-active { stroke-width: 3.5; stroke-opacity: 1; }
.pin {
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: var(--c); color: #fff; font-weight: 600; font-size: 0.875rem;
  box-shadow: 0 0 0 2px #fff; cursor: pointer; transition: transform .15s ease;
}
.pin.is-active { transform: scale(1.25); }
.origin-pin svg { width: 26px; height: 26px; display: block; }
.origin-pin path { fill: var(--ink); stroke: var(--snow); stroke-width: 1.6; }
.map-label { white-space: nowrap; font-family: var(--font-body); pointer-events: none; }
.map-label.origin { font-weight: 600; font-size: 0.8125rem; color: var(--ink); text-shadow: 0 0 3px var(--map-bg), 0 0 3px var(--map-bg); }
.map-label.town { font-style: italic; font-size: 0.75rem; color: var(--map-label); }
.map-label.town::before { content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--map-label); margin-right: 4px; vertical-align: middle; }
.map-label.peak { font-size: 0.75rem; color: var(--map-label); display: flex; align-items: center; gap: 3px; }
.map-label.peak svg { width: 10px; height: 9px; flex: none; }
.map-label.peak svg path { fill: var(--map-label); }
.map-label.prov-name { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--map-label); }

/* Lightbox */
dialog.lightbox { border: 0; padding: 0; background: transparent; max-width: min(1100px, 94vw); max-height: 90vh; }
dialog.lightbox::backdrop { background: rgba(10, 14, 12, .85); }
dialog.lightbox img { display: block; max-width: 100%; max-height: 82vh; margin: 0 auto; border-radius: 4px; }
dialog.lightbox p { margin: 8px 0 0; color: #e6eae5; font-size: 0.875rem; text-align: center; }
dialog.lightbox form { position: absolute; top: 6px; right: 6px; margin: 0; }
dialog.lightbox form button { font: inherit; font-size: 0.875rem; padding: 4px 10px; border-radius: 4px; border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }

.foot { border-top: 1px solid var(--rule); padding-block: 24px 40px; }
.foot .wrap { display: grid; gap: 6px; font-size: 0.875rem; color: var(--muted); }
.foot p { margin: 0; max-width: 80ch; }
.load-error { padding: 16px; border: 1px solid var(--rule); border-radius: 6px; }

@media (max-width: 1040px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .map-col { position: static; order: -1; }
  #map { height: 420px; min-height: 0; }
}
@media (max-width: 560px) {
  .collage[data-n="3"] button:first-child, .collage[data-n="4"] button:first-child { aspect-ratio: 3 / 2; }
  .summary .hide-sm { display: none; }
  #map { height: 360px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<header class="top wrap">
  <h1>Ciao Anna!</h1>
  <p class="intro" id="intro"></p>
  <p class="checked" id="checked"></p>
  <div class="summary-wrap">
    <table class="summary">
      <thead><tr><th></th><th>Posto</th><th>29 ott – 1 nov</th><th>In auto</th><th class="hide-sm">Camminata</th></tr></thead>
      <tbody id="summary"></tbody>
    </table>
  </div>
</header>

<main class="wrap layout">
  <section class="list" id="list" aria-label="I posti"></section>
  <aside class="map-col" aria-label="Mappa">
    <div class="map-box"><div id="map" role="region" aria-label="Mappa schematica intorno a Siusi"></div></div>
    <p class="map-caption">Mappa schematica, linee in linea d'aria da Siusi. Tocca un numero per andare al posto.</p>
  </aside>
</main>

<dialog class="lightbox" id="lightbox" aria-label="Foto">
  <form method="dialog"><button type="submit">Chiudi</button></form>
  <img id="lightbox-img" alt="">
  <p id="lightbox-cap"></p>
</dialog>

<footer class="foot">
  <div class="wrap" id="foot"></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(async function () {
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const thousands = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const statusLabel = { open: "Aperto", closed: "Chiuso", check: "Da verificare" };

  let data, geo;
  try {
    const get = p => fetch(p, { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(p); return r.json(); });
    [data, ...geo] = await Promise.all(["data/rifugi.json", "data/provinces.geojson", "data/rivers.geojson", "data/roads.geojson"].map(get));
  } catch (e) {
    $("#list").innerHTML = `<div class="load-error">Non riesco a caricare i dati (<code>data/rifugi.json</code>). Se hai aperto il file dal disco, avvia un server nella cartella del progetto: <code>python3 -m http.server</code>.</div>`;
    return;
  }
  const [provinces, rivers, roads] = geo;
  const o = data.origin, page = data.site, places = page.places;

  $("#intro").textContent = page.intro;
  $("#checked").textContent = page.checked;
  $("#foot").innerHTML = page.footer.map(p => `<p>${p}</p>`).join("");

  $("#summary").innerHTML = places.map(r => `
    <tr style="--c:${r.color}">
      <td><span class="num">${r.n}</span></td>
      <td class="name"><a href="#${r.id}">${esc(r.name)}</a><span class="sub">${esc(r.area)} · ${thousands(r.altitude_m)} m</span></td>
      <td><span class="status ${r.status}">${statusLabel[r.status]}</span><span class="status-note">${esc(r.status_note)}</span></td>
      <td>${r.drive_min ? `~${r.drive_min} min` : "Niente auto"}<span class="status-note">${esc(r.from_siusi)}</span></td>
      <td class="hide-sm">${r.walk ? `${esc(r.walk.time)} · ${esc(r.walk.ascent)}` : "–"}</td>
    </tr>`).join("");

  const mapsUrl = r => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.maps_query || r.name + " " + r.area)}`;
  $("#list").innerHTML = places.map(r => {
    const photos = r.photos || [];
    const credits = [...new Set(photos.map(p => p.credit))].join(", ");
    return `
    <article class="place" id="${r.id}" data-id="${r.id}" style="--c:${r.color}">
      <header class="place-head">
        <h2><span class="num">${r.n}</span>${esc(r.name)}</h2>
        <p class="meta">${esc(r.area)} (${r.province}) · ${thousands(r.altitude_m)} m · ${r.drive_min ? `~${r.drive_min} min d'auto da Siusi` : "cabinovia da Siusi"} · <span class="status ${r.status}">${statusLabel[r.status]}</span> ${esc(r.status_note)}</p>
      </header>
      ${photos.length ? `<div class="collage" data-n="${photos.length}">
        ${photos.map((p, i) => `<button type="button" data-src="${p.src}" data-cap="${esc(p.alt)} · Foto ${esc(p.credit)}" aria-label="Ingrandisci: ${esc(p.alt)}"><img src="${p.src}" alt="${esc(p.alt)}" loading="${r.n === 1 && i === 0 ? "eager" : "lazy"}"></button>`).join("")}
      </div>
      <p class="credit">Foto: ${esc(credits)}</p>` : ""}
      ${r.vibe ? `<div>
        <h3>Com'è</h3>
        <p>${esc(r.vibe)}</p>
      </div>` : ""}
      <div>
        <h3>Pranzo</h3>
        <p>${esc(r.lunch)}</p>
      </div>
      ${r.walk ? `<div>
        <h3>Camminata prima di pranzo</h3>
        <p class="walk-facts"><span>Partenza: <b>${esc(r.walk.start)}</b></span><span><b>${esc(r.walk.time)}</b> all'andata</span><span><b>${esc(r.walk.ascent)}</b></span></p>
        <p>${esc(r.walk.text)}</p>
      </div>` : ""}
      <div>
        <h3>Da sapere</h3>
        <ul class="notes">${r.notes.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
      </div>
      <div class="links">
        ${r.website ? `<a href="${r.website}" target="_blank" rel="noopener">Sito</a>` : ""}
        <a href="${mapsUrl(r)}" target="_blank" rel="noopener">Google Maps</a>
        <button type="button" data-show="${r.id}">Sulla mappa</button>
      </div>
    </article>`;
  }).join("");

  // Lightbox
  const lb = $("#lightbox");
  document.querySelectorAll(".collage button").forEach(b => b.addEventListener("click", () => {
    $("#lightbox-img").src = b.dataset.src;
    $("#lightbox-img").alt = b.querySelector("img").alt;
    $("#lightbox-cap").textContent = b.dataset.cap;
    lb.showModal();
  }));
  lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });

  // Map: tile servers are blocked inside the artifact, so it is drawn from the project's own GeoJSON
  if (!window.L) return;
  // A fixed overview: no pan or zoom, so swiping over it scrolls the page; pins stay tappable
  const map = L.map("map", { zoomControl: false, dragging: false, touchZoom: false, doubleClickZoom: false, scrollWheelZoom: false, boxZoom: false, keyboard: false, zoomSnap: 0.25 });
  map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  map.attributionControl.addAttribution("Natural Earth");
  // The view must exist before any polyline is added, or Leaflet's clipping throws
  const home = L.latLngBounds([[o.lat, o.lng], ...places.map(r => [r.lat, r.lng]), ...(page.peaks || []).map(p => [p.lat, p.lng])]);
  map.fitBounds(home, { padding: [30, 30] });
  map.on("resize", () => map.fitBounds(home, { padding: [30, 30] }));
  const provClass = { Bozen: "prov-bozen", Trento: "prov-trento", Belluno: "prov-belluno", Tirol: "prov-tirol" };
  // Panes: region fills, then the relief (multiplied over them), then lines and pins in the default panes
  map.createPane("base").style.zIndex = 300;
  map.createPane("relief").style.zIndex = 350;
  L.geoJSON(provinces, { pane: "base", interactive: false, style: f => ({ className: `prov ${provClass[f.properties.name] || ""}`, fill: true, fillOpacity: 1 }) }).addTo(map);
  if (page.relief) {
    L.imageOverlay(page.relief.src, page.relief.bounds, { pane: "relief", interactive: false }).addTo(map);
    map.attributionControl.addAttribution(page.relief.credit);
  }
  L.geoJSON(rivers, { interactive: false, style: { className: "river", weight: 2 } }).addTo(map);
  L.geoJSON(roads, { interactive: false, style: { className: "road", weight: 2.5 } }).addTo(map);

  const label = (lat, lng, html, cls, anchor = [0, 0]) =>
    L.marker([lat, lng], { interactive: false, keyboard: false, icon: L.divIcon({ className: "", html: `<div class="map-label ${cls}">${html}</div>`, iconSize: null, iconAnchor: anchor }) }).addTo(map);
  (page.towns || []).forEach(t => label(t.lat, t.lng, esc(t.name), "town", [3, 8]));
  (page.peaks || []).forEach(p => label(p.lat, p.lng,
    `<svg viewBox="0 0 11 10" aria-hidden="true"><path d="M5.5 0 11 10H0Z"/></svg><b>${esc(p.name)}</b> ${thousands(p.altitude_m)}`, "peak", [5, 5]));

  const pins = {}, routes = {};
  places.forEach(r => {
    routes[r.id] = L.polyline([[o.lat, o.lng], [r.lat, r.lng]], { color: r.color, weight: 2, opacity: 0.7, dashArray: "5 6", className: "route", interactive: false }).addTo(map);
  });
  L.marker([o.lat, o.lng], { keyboard: false, interactive: false, icon: L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
    html: '<div class="origin-pin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.8 6.1 6.7.7-5 4.5 1.4 6.6L12 17l-5.9 3.4 1.4-6.6-5-4.5 6.7-.7z"/></svg></div>' }) }).addTo(map);
  label(o.lat, o.lng, esc(o.name), "origin", [-16, 30]);
  places.forEach(r => {
    const m = L.marker([r.lat, r.lng], { title: r.name, alt: r.name, riseOnHover: true, icon: L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
      html: `<div class="pin" data-pin="${r.id}" style="--c:${r.color}">${r.n}</div>` }) }).addTo(map);
    m.bindTooltip(`${esc(r.name)} · ${thousands(r.altitude_m)} m`, { direction: "top", offset: [0, -16] });
    m.on("click", () => { setActive(r.id); document.getElementById(r.id).scrollIntoView({ behavior: "smooth", block: "start" }); });
    pins[r.id] = m;
  });

  let active = null;
  function setActive(id) {
    if (id === active) return;
    active = id;
    document.querySelectorAll(".pin").forEach(p => p.classList.toggle("is-active", p.dataset.pin === id));
    Object.entries(routes).forEach(([k, line]) => {
      const el = line.getElement(); if (el) el.classList.toggle("is-active", k === id);
      if (k === id) line.bringToFront();
    });
  }
  document.querySelectorAll(".place").forEach(a => {
    a.addEventListener("mouseenter", () => setActive(a.dataset.id));
    a.addEventListener("focusin", () => setActive(a.dataset.id));
  });
  const wide = window.matchMedia("(min-width: 1041px)");
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(entries => {
      if (!wide.matches) return;
      entries.forEach(e => { if (e.isIntersecting) setActive(e.target.dataset.id); });
    }, { rootMargin: "-35% 0px -60% 0px" });
    document.querySelectorAll(".place").forEach(a => io.observe(a));
  }
  document.querySelectorAll("[data-show]").forEach(b => b.addEventListener("click", () => {
    const r = places.find(x => x.id === b.dataset.show);
    setActive(r.id);
    if (!wide.matches) document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" });
    pins[r.id].openTooltip();
  }));

  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>

</html>
